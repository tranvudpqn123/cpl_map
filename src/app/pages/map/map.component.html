<section class="position-relative map-page">
    <div class="position-fixed merchant-map" id="map">
    </div>

    <div class="position-absolute top-filter">
        <ul class="d-flex w-100 align-items-center gap-1 overflow-auto">
            @for(serviceType of serviceTypes(); track serviceType.id) {
                <li class="list-group">
                    <button
                        class="px-3 mx-1 btn-service-type fw-medium d-flex align-items-center"
                        (click)="onOpenSubServiceTypesModal(serviceType)"
                    >
                        <img [src]="serviceType.icons" alt="{{serviceType.name}}">
                        <span class="mx-2">{{ serviceType.name }}</span>
                    </button>
                </li>
            }
            @if(window.innerWidth < 600) {
                <li class="list-group">
                    <button
                        class="px-3 mx-1 btn-service-type fw-medium d-flex align-items-center"
                        (click)="onViewAllModal()">
                        <span class="mx-2">Xem toàn bộ</span>
                    </button>
                </li>
            }
        </ul>
    </div>

    <div class="position-absolute bg-white left-filter">
        <app-filter [keyS]="serviceTypeSelected"></app-filter>
        <!--        <app-slider-photos></app-slider-photos>-->
        <!--        <app-personal-groups></app-personal-groups>-->

        @if (showMerchantGroupType()) {
            <app-personal-groups></app-personal-groups>
        }

        @if (selectedMerchant()) {
            <app-address-detail
                [isShowMerchantGroups]="isShowMerchantGroups()"
                [selectedMerchant]="selectedMerchant()"
                (showMerchantGroupsChange)="this.isShowMerchantGroups.set($event)"
            ></app-address-detail>
        }

        <app-sidebar></app-sidebar>
    </div>
</section>

<ng-template cdkPortal>
    <div class="pt-3 px-3 pb-4 rounded bg-white sub-service-types">
        <div class="fw-500 fs-5 pt-2 pb-3 text-center">{{selectedService()!.name}}</div>
        <hr class="mb-4 mx-auto w-50">
        <div class="d-grid gap-3 grid">
            @for(subServiceType of subServiceTypes(); track subServiceType.id) {
                <button
                    class="p-0 d-flex align-items-center justify-content-center flex-column btn btn-sub-service-type"
                    [title]="subServiceType.name"
                    (click)="onSelectSubServiceType(subServiceType)"
                >
                    <div class="overflow-hidden avatar">
                        <img class="d-inline-block" [src]="subServiceType.avatar" [alt]="subServiceType.name">

                    </div>
                    <div class="c-text-truncate">
                        {{ subServiceType.name }}
                    </div>
                </button>
            }
        </div>


    </div>
</ng-template>
